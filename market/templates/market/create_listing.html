{% extends 'market/base.html' %}

{% load static %}
{% block extra_js %}
    <script src="{% static 'js/listing_form.js' %}"></script>
    <script src="{% static 'js/validation.js' %}"></script>
{% endblock %}
{% block content %}
<div class="auth-container" style="max-width: 600px;">
    <h2 class="auth-header">
        {% if title %}{{ title }}{% else %}Sprzedaj grę{% endif %}
    </h2>

    <form method="post" enctype="multipart/form-data" id="listing-form" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success btn-block">
            {% if title %}Zapisz zmiany{% else %}Wystaw ofertę{% endif %}
        </button>
    </form>

    <a href="{% url 'market:listing_list' %}" class="btn-link-cancel">Anuluj i wróć</a>
</div>
{% endblock %}
