{% extends 'market/base.html' %}

{% block content %}
<div class="auth-container" style="max-width: 600px;"> <h2 class="auth-header">Sprzedaj grę</h2>

        {% csrf_token %}
        {{ form.as_p }}

    <a href="{% url 'market:listing_list' %}" class="btn-link-cancel">Anuluj i wróć</a>
</div>
{% endblock %}
